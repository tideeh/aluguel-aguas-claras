AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Acesso do GitHub Actions (OIDC, sem chaves guardadas) para publicar o backend do site
  Alugueis em Aguas Claras. Execute uma unica vez, na regiao sa-east-1.

Parameters:
  SubjectGitHub:
    Type: String
    Default: repo:tideeh@33804453/aluguel-aguas-claras@1452667290:ref:refs/heads/main
    Description: >-
      Valor exato do claim sub do token OIDC autorizado. Repositorios criados apos 15/07/2026 usam
      o formato com IDs imutaveis (repo:dono@id/repositorio@id:ref:refs/heads/main).
  CriarProvedorOidc:
    Type: String
    AllowedValues: ['sim', 'nao']
    Default: 'sim'
    Description: Use "nao" se a conta ja tiver o provedor OIDC token.actions.githubusercontent.com

Conditions:
  CriarProvedor: !Equals [!Ref CriarProvedorOidc, 'sim']

Resources:
  ProvedorGitHub:
    Type: AWS::IAM::OIDCProvider
    Condition: CriarProvedor
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  Artefatos:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub aluguel-aguas-claras-artefatos-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: apagar-pacotes-antigos
            Status: Enabled
            ExpirationInDays: 30

  # Teto de permissoes de qualquer papel criado pelo deploy: mesmo que o workflow seja abusado,
  # a funcao so consegue mexer na propria tabela e escrever os proprios logs.
  LimiteFuncao:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: aluguel-aguas-claras-limite
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [dynamodb:Query, dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem]
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/aluguel-aguas-claras-*
          - Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/aluguel-aguas-claras-*

  PapelDeploy:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aluguel-aguas-claras-deploy
      Description: Usado pelo GitHub Actions do repositorio para publicar o backend
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CriarProvedor
                - !Ref ProvedorGitHub
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref SubjectGitHub
      Policies:
        - PolicyName: publicar-backend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Curingas por servico, sempre restritos aos recursos com o prefixo do projeto.
              - Sid: Stack
                Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aluguel-aguas-claras-api/*
              - Sid: TransformSam
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: LeituraGeralCloudFormation
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary]
                Resource: '*'
              - Sid: Artefatos
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub ${Artefatos.Arn}/*
              - Sid: ArtefatosBucket
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt Artefatos.Arn
              - Sid: Funcao
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:aluguel-aguas-claras-*
              - Sid: Tabela
                Effect: Allow
                Action: dynamodb:*
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/aluguel-aguas-claras-*
              - Sid: Logs
                Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/aluguel-aguas-claras-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/aluguel-aguas-claras-*:*
              - Sid: LogsLeitura
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              # Papeis da funcao: so com o limite acima aplicado, e so com o prefixo da stack.
              - Sid: PapelDaFuncaoComLimite
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aluguel-aguas-claras-api-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref LimiteFuncao
              - Sid: PapelDaFuncao
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:DeleteRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aluguel-aguas-claras-api-*
              - Sid: PassarPapelSoParaLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aluguel-aguas-claras-api-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

Outputs:
  PapelArn:
    Description: Cadastre este valor no secret AWS_ROLE_ARN do repositorio
    Value: !GetAtt PapelDeploy.Arn
  Bucket:
    Description: Bucket dos pacotes de deploy
    Value: !Ref Artefatos
